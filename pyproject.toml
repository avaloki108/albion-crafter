[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "albion-crafter"
version = "0.6.0"
description = "A trust-aware Albion Online crafting and refining profitability planner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Albion Crafter contributors" }]
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
albion-crafter = "albion_crafter.main:main"
albion-crafter-update-data = "albion_crafter.update_static_data:main"

[tool.hatch.build.targets.wheel]
packages = ["src/albion_crafter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
